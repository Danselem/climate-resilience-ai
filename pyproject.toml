[project]
name = "climate-resilience"
version = "0.1.0"
description = "Climate Resilience Intelligence Platform — eThekwini pilot"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.151.1",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-ai-slim[openrouter]>=2.71.0",
    "pydantic-settings>=2.3",
    "pyproj>=3.6",
    "python-dateutil>=2.9",
    "rasterio>=1.5.2",
    "sentence-transformers>=6.3.0",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
climate-resilience = "climate_resilience.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_resilience"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: requires live network access"]
